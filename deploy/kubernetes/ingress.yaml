apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retaillens-ingress
  namespace: retaillens-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - retaillens.company.com
      secretName: retaillens-tls-cert
  rules:
    - host: retaillens.company.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: retaillens-service
                port:
                  number: 8501
