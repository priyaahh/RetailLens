apiVersion: v1
kind: ConfigMap
metadata:
  name: retaillens-config
  namespace: retaillens-prod
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  DB_PORT: "5432"
  DB_SSLMODE: "require"
  PROCESSING_ENGINE: "auto"
  SPARK_THRESHOLD_MB: "100"
  STORAGE_BACKEND: "s3"
  OBJECT_STORAGE_BUCKET: "retaillens-data-lake-prod"
  CLOUD_REGION: "us-east-1"
  REDIS_URL: "redis://retaillens-redis-service.retaillens-prod.svc.cluster.local:6379/0"
  METRICS_ENABLED: "true"
