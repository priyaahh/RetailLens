apiVersion: apps/v1
kind: Deployment
metadata:
  name: retaillens-app
  namespace: retaillens-prod
  labels:
    app: retaillens
    component: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retaillens
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: retaillens
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: retaillens-container
          image: retaillens:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
              name: http-ui
            - containerPort: 8000
              name: http-api
          envFrom:
            - configMapRef:
                name: retaillens-config
            - secretRef:
                name: retaillens-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
